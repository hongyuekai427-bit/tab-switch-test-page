<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tab Switch Test Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #111;
            color: #fff;
        }

        .container {
            width: min(600px, 90vw);
            padding: 32px;

            text-align: center;

            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 16px;
        }

        h1 {
            margin: 0 0 12px;
        }

        p {
            color: #aaa;
            line-height: 1.5;
        }

        button {
            margin-top: 20px;

            padding: 12px 20px;

            border: 1px solid #444;
            border-radius: 8px;

            background: #252525;
            color: #fff;

            font: inherit;
            cursor: pointer;
        }

        button:hover {
            background: #303030;
        }

        button:active {
            background: #383838;
        }

        #status {
            margin-top: 20px;

            padding: 12px;

            border-radius: 8px;

            background: #252525;

            font-family: monospace;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Tab Switch Test</h1>

        <p>
            This page is used to test browser focus and tab switching.
        </p>

        <button id="closeWindow" type="button">
            Close Test Page
        </button>

        <div id="status">
            Test page active
        </div>

    </main>

    <script>
        "use strict";

        const closeButton =
            document.getElementById("closeWindow");

        const status =
            document.getElementById("status");

        closeButton.addEventListener("click", () => {
            window.close();

            /*
             * If the browser refuses to close the tab,
             * tell the user why.
             */
            setTimeout(() => {
                if (!window.closed) {
                    status.textContent =
                        "The browser did not allow this tab to close automatically.";
                }
            }, 100);
        });

        /*
         * Focus / visibility information
         */

        document.addEventListener(
            "visibilitychange",
            () => {
                status.textContent = document.hidden
                    ? "Test page hidden"
                    : "Test page visible";
            }
        );

        window.addEventListener("blur", () => {
            status.textContent =
                "Test page lost focus";
        });

        window.addEventListener("focus", () => {
            status.textContent =
                "Test page active";
        });
    </script>

</body>

</html>
